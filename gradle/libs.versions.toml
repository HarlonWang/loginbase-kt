[versions]
agp = "9.2.1"
kotlin = "2.4.10"
android-minSdk = "24"
android-compileSdk = "37"
vanniktechMavenPublish = "0.37.0"
ktor = "3.5.2"
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.11.0"
# browser 模块专用（可选 artifact，核心的依赖最小集不含它）
androidx-browser = "1.10.0"
# Auth Tab 的 ActivityResultLauncher 需要 ComponentActivity（browser 模块直接引用其类型，显式声明不吃传递）
androidx-activity = "1.13.0"
androidx-core = "1.19.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
# engine 刻意不依赖：消费方各自提供，库自带会重复引入，也违背依赖最小集
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
# 仅测试用：验证 README 接入指南第 2 步那段 Auth 插件接线真能编译、真能跑通。
# 不进产物，故不违反「依赖最小集」——库自己绝不引它（BearerTokens 在这个包里，
# 引了就等于把 ktor 的插件 API 写进本库的公开契约）。
ktor-client-auth = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }
# ↓ 仅 :browser 使用。coroutines-android 与 core 复用同一个版本条目，防 class-path 双版本
androidx-browser = { module = "androidx.browser:browser", version.ref = "androidx-browser" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "androidx-activity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }

[plugins]
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechMavenPublish" }
