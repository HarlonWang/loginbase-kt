name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ubuntu runner 编不了 iOS target，故只跑 android host test；
      # iOS 侧的编译由 publish（macos runner）与本地开发覆盖
      - name: Build and test
        run: ./gradlew :library:testAndroidHostTest :library-browser:testAndroidHostTest
